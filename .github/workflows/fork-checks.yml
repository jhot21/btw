name: Fork checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fork-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hook checker self-test
        run: scripts/test/check-fork-hooks-test.sh
      - name: Check fork hooks and conflict markers
        run: scripts/check-fork-hooks.sh

  passgen-tests:
    needs: fork-hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Passgen and generator unit tests
        run: >
          ./gradlew :app:testStandardDebugUnitTest
          --tests 'com.x8bit.bitwarden.data.tools.passgen.*'
          --tests 'com.x8bit.bitwarden.ui.tools.feature.generator.*'
